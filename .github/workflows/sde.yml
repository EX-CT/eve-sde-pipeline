name: sde-dataset
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      build:
        description: "SDE build number (default: latest)"
        required: false
        default: "latest"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Resolve build
        id: b
        run: |
          if [ "${{ github.event.inputs.build }}" = "" ] || [ "${{ github.event.inputs.build }}" = "latest" ]; then
            echo "build=$(python -m sdepipe latest)" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ github.event.inputs.build }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if released
        id: chk
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "sde-${{ steps.b.outputs.build }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Download SDE
        if: steps.chk.outputs.skip != '1'
        run: python -m sdepipe download --build ${{ steps.b.outputs.build }} --dest sde
      - name: Build dataset
        if: steps.chk.outputs.skip != '1'
        run: python -m sdepipe build --sde sde --out dist
      - name: Unit tests
        if: steps.chk.outputs.skip != '1'
        run: python -m unittest discover -s tests -v
      - name: Release
        if: steps.chk.outputs.skip != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          B=${{ steps.b.outputs.build }}
          gh release create "sde-$B" dist/dataset-$B.json.gz dist/manifest.json \
            --title "SDE build $B" --notes "Engine dataset for CCP SDE build $B (format v1). EVE data © CCP hf., see LICENSE.EVE." --latest
